<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Login - Parcel Express
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<h2>🚚 Parcel Express</h2>

</nav>



<div class="form-container">


<h1>Login</h1>


<form id="loginForm">


<input 
type="email"
id="loginEmail"
placeholder="Enter Email"
required
>


<input 
type="password"
id="loginPassword"
placeholder="Enter Password"
required
>


<button type="submit">
Login
</button>


</form>


<p id="loginMessage"></p>


</div>



<script src="script.js"></script>


</body>

</html>
