<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Register - Parcel Express
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<nav>

<h2>🚚 Parcel Express</h2>

</nav>



<div class="form-container">


<h1>Create Account</h1>


<form id="registerForm">


<input 
type="text"
id="name"
placeholder="Enter Your Name"
required
>


<input 
type="email"
id="email"
placeholder="Enter Email"
required
>



<input 
type="number"
id="phone"
placeholder="Enter Phone Number"
required
>

<input 
type="password"
id="password"
placeholder="Create Password"
required
>
<input 
type="password"
id="confirmPassword"
placeholder="Confirm Password"
required
>



<button type="submit">
Register
</button>


</form>



<p id="message"></p>


</div>



<script src="script.js"></script>


</body>

</html>
