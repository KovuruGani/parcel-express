<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Parcel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
    <h2>🚚 Parcel Express</h2>
</nav>

<div class="form-container">

<h1>Book Parcel</h1>

<form id="bookForm">

<input type="text" id="sender" placeholder="Sender Name" required>

<input type="text" id="receiver" placeholder="Receiver Name" required>

<input type="text" id="pickup" placeholder="Pickup Address" required>

<input type="text" id="delivery" placeholder="Delivery Address" required>

<input type="number" id="weight" placeholder="Parcel Weight (kg)" required>

<button type="submit">Book Parcel</button>

</form>

<p id="bookMessage"></p>

</div>

<script src="script.js"></script>

</body>
</html>
